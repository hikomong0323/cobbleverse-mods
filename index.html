["Sophisticated Core","Sophisticated Backpacks, Storage"],
["Searchables","Controlling"],
["Athena","연결 텍스처용 (추정)"],
["Fusion","연결 텍스처용 (Rechiseled)"],
["Configurable","설정 라이브러리 (추정)"],
["Wild Battle API","Cobblemon Battle Tower"]]
};
const client = new Set(["Advancement Plaques","BadOptimizations","Better Beds","BetterF1","BetterF3","Better Third Person","Better Recipe Book","Catch Indicator","Cobblemon Catch Rate Display","Continuity","Controlling","Custom Splash Screen","Kingdom Cats Replacer","Entity Model Features","Entity Texture Features","Euphoria Patcher","ImmediatelyFast","Infinite Music","Iris","LumyREI","Mod Menu","More Culling","Mouse Tweaks","MusicNotification","Overflowing Bars","Paginated Advancements","Particle Core","Particle Rain","Reese's Sodium Options","Resource Pack Overrides","Searchables","Sodium","SoundsBeGone","ToolTip Fix","Zoomify","FancyMenu","Konkrete","Melody","Xaero's Minimap","Xaero's World Map","EntityCulling","NotEnoughAnimations","Sound Physics Remastered","Cobblemon Party Extras"]);
const server = new Set(["Chunky","spark","BlueMap","Simple Discord Link","CraterLib","Spawn Notification","Cobbleworkers"]);
const sides = [["클라이언트", n => !server.has(n)], ["서버", n => !client.has(n)]];
const only = n => client.has(n) || server.has(n) ? ' <span class="only">전용</span>' : "";
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
document.getElementById("main").innerHTML = sides.map(([title, keep]) => {
  let body = "", count = 0;
  for (const [cat, all] of Object.entries(data)) {
    const mods = all.filter(([n]) => keep(n));
    if (!mods.length) continue;
    count += mods.length;
    body += `<h3>${cat} (${mods.length})</h3><table><tr><th>모드</th><th>${cat === "라이브러리" ? "주로 쓰는 곳" : "설명"}</th></tr>`
      + mods.map(([n, d]) => `<tr><td>${esc(n)}${only(n)}</td><td>${esc(d)}</td></tr>`).join("") + "</table>";
  }
  return `<section><h2>${title} (${count})</h2>${body}</section>`;
}).join("");
